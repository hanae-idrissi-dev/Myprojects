<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
</head>
<body>
    <div id="list">
    <input type="text" id="add" placeholder="Ajouter une tache" value="">
    <button type="button" >Ajouter</button>
    <p id="nouveau"></p>
    </div> 
   <script>
   let tache=document.getElementById("add");
   let button=document.getElementsByTagName("button");
   let  nv=document.getElementById("nouveau");
   let text="";

   button[0].addEventListener("click",function(event){
    event.preventDefault();
    if(tache.value!=""){
     let element=document.createElement("li");
     element.innerText=tache.value+"";
     let supprimer=document.createElement("button");
     supprimer.innerText="suprimer";
     supprimer.addEventListener("click",function(){
    element.remove();
     });
    element.appendChild(supprimer);
    nv.appendChild(element);


    }
   });

   </script>






</body>
</html>
